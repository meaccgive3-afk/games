<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#132a22" />
    <title>المزاد</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #132a22;
        color: #f2f5f3;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        text-align: center;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: 22rem;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.6;
        color: #a9bdb4;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(242, 245, 243, 0.18);
        border-top-color: #c8a24a;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" role="status" aria-label="جاري التحميل"></div>
      <h1>المزاد</h1>
      <p>جاري الاتصال بالخدمة… تأكد من اتصالك بالإنترنت، فاللعبة تحتاج شبكة للعمل.</p>
    </main>
  </body>
</html>
